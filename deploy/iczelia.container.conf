# /etc/iczelia/iczelia.conf inside the container image.
# State paths point at the /var/lib/iczelia volume; share-dir at the
# read-only /opt/iczelia tree.

listen-tcp        = 0.0.0.0:8731
listen-socket     =
workers           = 4
max-requests      = 500
request-cap       = 8388608
keepalive-timeout = 0.25

db          = /var/lib/iczelia/site.db
media-dir   = /var/lib/iczelia/media
tmp-dir     = /var/lib/iczelia/tmp
share-dir   = /opt/iczelia/share
chrome-dir  = /opt/iczelia/share/chrome

# Optional. The host nginx running outside the container can listen for
# PURGE on a loopback address; fill this in to enable cache busting on
# admin save / fetcher run.
nginx-purge-url =

# Auto-update (bin/iczelia-update). Inside the container the source is
# read-only and the volume is the only mutable surface, so the updater
# normally lives on the host. These keys document the defaults; flip
# them on if a future deploy puts the git checkout inside the container.
# update-remote      = origin
# update-tag-prefix  = v
# update-restart-cmd =
