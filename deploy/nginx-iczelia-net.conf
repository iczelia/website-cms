# /etc/nginx/conf.d/iczelia-net.conf
#
# Reverse proxy in front of the iczelia daemon (port 8731). Lives next
# to the existing nginx.conf which keeps git.iczelia.net, mail, matrix,
# and palaiologos.rocks vhosts unchanged.
#
# Layout:
#   /                      -> daemon
#   /admin/, /blog/, ...   -> daemon (everything the daemon owns wins
#                              over filesystem)
#   /jcram, /jcramv2,      -> preserved static fallback to
#   /jcramv2b, /library,      /var/www/website/<dir>/ for legacy projects
#   /sdlgames,
#   /sophie-germain,
#   /wp-admin
#   anything else          -> 404 from daemon (the daemon's own
#                             not_found_handler renders a themed page)

upstream iczelia_daemon {
    server 127.0.0.1:8731;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/iczelia
                 levels=1:2 keys_zone=iczelia:10m
                 max_size=200m inactive=60m use_temp_path=off;

server {
    server_name iczelia.net;

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/iczelia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iczelia.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 50m;

    # Bot blocklist.
    if ($http_user_agent ~* "(?:acunetix|BLEXBot|domaincrawler\.com|LinkpadBot|MJ12bot/v|majestic12\.co\.uk|AhrefsBot|TwengaBot|SemrushBot|nikto|winhttp|Xenu\s+Link\s+Sleuth|Baiduspider|HTTrack|clshttp|harvest|extract|grab|miner|python-requests)") {
        return 403;
    }

    # Legacy static projects served from disk. Order matters: these
    # locations are checked before the catch-all proxy. Various old trash.
    location /jcram/         { alias /var/www/website/jcram/;         try_files $uri $uri/ =404; }
    location /jcramv2/       { alias /var/www/website/jcramv2/;       try_files $uri $uri/ =404; }
    location /jcramv2b/      { alias /var/www/website/jcramv2b/;      try_files $uri $uri/ =404; }
    location /library/       { alias /var/www/website/library/;       try_files $uri $uri/ =404; }
    location /sdlgames/      { alias /var/www/website/sdlgames/;      try_files $uri $uri/ =404; }
    location /sophie-germain/ { alias /var/www/website/sophie-germain/; try_files $uri $uri/ =404; }
    location /wp-admin/      { alias /var/www/website/wp-admin/;      try_files $uri $uri/ =404; }

    # Loopback PURGE endpoint for the daemon's bust calls.
    # SECURITY: allow/deny is the only thing keeping this private.
    location ~ /purge(/.*) {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_cache_purge iczelia $1;
    }

    # Everything else: daemon.
    location / {
        proxy_pass http://iczelia_daemon;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache iczelia;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $cookie_iczelia_sid;
        proxy_no_cache     $cookie_iczelia_sid;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_read_timeout 30s;
    }
}
