# /etc/iczelia/iczelia.conf - operator config for the iczelia daemon.
# Uncomment / customize as needed. Defaults match the dev `var/` layout
# at the repo root; production should override the dirs below.

listen-socket = /run/iczelia/sock
# Alternatively:
# listen-tcp = 127.0.0.1:8731

workers      = 4
max-requests = 500
request-cap  = 8388608

db          = /var/lib/iczelia/site.db
media-dir   = /var/lib/iczelia/media
tmp-dir     = /var/lib/iczelia/tmp
share-dir   = /opt/iczelia/share
chrome-dir  = /opt/iczelia/share/chrome

# Set this to a path-readable hex string OR leave blank and place a file
# at /var/lib/iczelia/cookie-secret containing 64 hex chars.
# cookie-secret = <64-hex-chars>

# nginx purge endpoint (loopback)
nginx-purge-url = http://127.0.0.1/purge

# Auto-update (bin/iczelia-update; only meaningful on a git checkout).
# Fetches release tags from this remote and fast-forwards to the next
# patch tag (vX.Y.Z+1). A single run never jumps by more than 0.0.1.
# update-remote      = origin
# update-tag-prefix  = v
# Shell command run after a successful self-update (empty = none):
# update-restart-cmd = sudo systemctl restart iczelia
