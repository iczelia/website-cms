# /etc/nginx/sites-available/iczelia.conf
#
# TLS-terminating reverse proxy in front of the iczelia daemon. The
# daemon owns all caching.

upstream iczelia {
    server unix:/run/iczelia/sock;
    # Podman install: comment the line above and uncomment:
    # server 127.0.0.1:8731;
}

server {
    listen 80;
    listen [::]:80;
    server_name iczelia.net www.iczelia.net;
    return 301 https://iczelia.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iczelia.net;

    ssl_certificate     /etc/letsencrypt/live/iczelia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iczelia.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header          Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://iczelia;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
