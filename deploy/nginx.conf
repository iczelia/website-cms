# /etc/nginx/sites-available/iczelia.conf
#
# Reverse proxy in front of the iczelia daemon. The daemon serves
# everything (chrome, /media/, dynamic routes); nginx terminates TLS,
# adds an edge proxy_cache, and exposes a loopback PURGE endpoint.
#
# Native systemd install:  upstream = unix:/run/iczelia/sock
# Podman container install: upstream = http://127.0.0.1:8731
# Pick one of the `upstream` blocks below.

upstream iczelia {
    # Native systemd install: daemon listens on a unix socket.
    server unix:/run/iczelia/sock;
    # Podman: comment the line above and uncomment this one.
    # server 127.0.0.1:8731;
}

proxy_cache_path /var/cache/nginx/iczelia
                 levels=1:2 keys_zone=iczelia:10m
                 max_size=200m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name iczelia.net www.iczelia.net;
    return 301 https://iczelia.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iczelia.net;

    ssl_certificate     /etc/letsencrypt/live/iczelia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iczelia.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header          Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://iczelia;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache iczelia;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $cookie_iczelia_sid;
        proxy_no_cache     $cookie_iczelia_sid;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # PURGE entry point for the daemon and activity fetcher.
    # SECURITY: the allow/deny is the only thing keeping this private.
    # Do not relax it without understanding the consequences.
    location ~ /purge(/.*) {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_cache_purge iczelia $1;
    }
}
