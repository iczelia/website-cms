name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install perl + system deps for cpan builds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbi-perl libdbd-sqlite3-perl \
            cpanminus build-essential libperl-dev \
            libcrypt-dev libbrotli-dev
      - name: install cpan deps
        run: sudo cpanm --notest --quiet IO::Compress::Brotli Gzip::Zopfli
      - name: perl -c on every module and script
        run: |
          for f in $(find lib -name '*.pm') $(find bin -type f); do
            perl -Ilib -c "$f"
          done
      - name: build the dev database
        run: |
          mkdir -p var/tmp var/media
          bin/iczelia-init --force
      - name: iczelia-server --check
        run: bin/iczelia-server --check

  test:
    name: tests (perl ${{ matrix.perl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5.38', '5.40']
    steps:
      - uses: actions/checkout@v4
      - name: set up perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: install build prerequisites for cpan deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcrypt-dev libbrotli-dev cmake
      - name: install cpan deps
        run: cpanm --notest --quiet DBI DBD::SQLite IO::Compress::Brotli Gzip::Zopfli
      - name: install the TeX toolchain (math rendering tests)
        run: |
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended texlive-latex-extra \
            dvisvgm dvipng brotli curl
      - name: prove t/
        run: prove -l --jobs 4 t/

  image:
    name: container build + smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image from deploy/Containerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          tags: iczelia:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (the daemon comes up and answers /healthz)
        run: |
          docker run -d --name iczelia-ci -p 8731:8731 iczelia:ci
          for _ in $(seq 1 60); do
            [ "$(curl -fsS http://127.0.0.1:8731/healthz 2>/dev/null)" = ok ] && exit 0
            sleep 2
          done
          echo "::error::daemon never answered /healthz with ok"
          docker logs iczelia-ci
          exit 1
      - name: daemon logs
        if: always()
        run: docker logs iczelia-ci 2>&1 || true
      - name: stop the container
        if: always()
        run: docker rm -f iczelia-ci || true
